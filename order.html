<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оставить заявку — Задушевный книжный</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header__inner container">
      <a class="site-header__logo" href="index.html">Задушевный книжный</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Книга</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="form-wrapper">
          <h1 class="section__title" style="text-align: center;">Оформить заявку</h1>
          <p style="text-align: center; color: var(--color-muted); margin-bottom: 30px;">
            Оставьте свои контакты, и мы поможем подобрать идеальную книгу.
          </p>

          <form class="order-form" action="#" method="post">
            
            <div class="order-form__field">
              <label class="order-form__label" for="user-name">Ваше имя *</label>
              <input class="order-form__input" id="user-name" name="name" type="text" required placeholder="Иван Иванов">
            </div>

            <div class="order-form__field">
              <label class="order-form__label" for="user-email">E-mail *</label>
              <input class="order-form__input" id="user-email" name="email" type="email" required placeholder="ivan@example.com">
            </div>

            <div class="order-form__field">
              <label class="order-form__label" for="user-phone">Телефон *</label>
              <input class="order-form__input" id="user-phone" name="phone" type="tel" required placeholder="+7 900 000-00-00">
            </div>

                        <div class="order-form__field">
              <label class="order-form__label" for="user-topic">Интересующая книга</label>
              <select class="order-form__input" id="user-topic" name="topic">
                <option value="">-- Выберите из списка --</option>
                <option value="ponedel">Понедельник начинается в субботу</option>
                <option value="sianie">Сияние</option>
                <option value="chatterley">Любовник леди Чаттерлей</option>
                <option value="palata">Палата номер 6</option>
                <option value="alisa">Алиса в Стране Чудес</option>
                <option value="other">Другая (напишу в комментарии)</option>
              </select>
            </div>

            <div class="order-form__field">
              <label class="order-form__label" for="user-comment">Комментарий</label>
              <textarea class="order-form__input" id="user-comment" name="comment" rows="4" placeholder="Ваши пожелания или вопросы..."></textarea>
            </div>

            <div class="order-form__check">
              <input id="user-consent" name="consent" type="checkbox" required>
              <label for="user-consent">Я согласен на обработку персональных данных *</label>
            </div>

            <button class="button" type="submit" style="width: 100%; margin-top: 10px;">Отправить заявку</button>

          </form>
        </div>
      </div>
    </section>
  </main>

   <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__text">© 2026 Ваш «Задушевный книжный». К читателю — с душой.</p>
      <a class="site-footer__link" href="#top">Наверх</a>
    </div>
  </footer>
  
  <script src="js/main.js"></script>
</body>
</html>
